name: deploy 
on:
  push:
    branches:
      - master 
      - main
  workflow_call:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install mkdocs-material==9.7.7
      - run: pip install mkdocs-git-revision-date-localized-plugin==1.6.0
      - run: pip install pillow==12.3.0 cairosvg==2.9.1
      - run: mkdocs gh-deploy --force